# Ghora Pay — Apache VirtualHost
# PORT is set by Render at runtime; the start.sh script injects it here.
Listen ${PORT}

<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html
    ServerAdmin webmaster@localhost

    <Directory /var/www/html>
        Options -Indexes -ExecCGI
        AllowOverride All
        Require all granted

        # Security headers
        Header always set X-Frame-Options "DENY"
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </Directory>

    # Block access to sensitive paths
    <DirectoryMatch "/(includes|db|android)/">
        Require all denied
    </DirectoryMatch>

    <FilesMatch "^(config\.php|composer\.json|\.env|\.git)">
        Require all denied
    </FilesMatch>

    # PHP error logging to stderr (Render captures it)
    php_flag  display_errors Off
    php_flag  log_errors On
    php_value error_log /dev/stderr

    LogFormat "%h %l %u %t \"%r\" %>s %b" common
    ErrorLog  /dev/stderr
    CustomLog /dev/stdout common
</VirtualHost>
